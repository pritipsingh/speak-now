<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <rect width="900" height="172" rx="16" fill="#16181d"/>

  <!-- Idle: small orb -->
  <circle cx="120" cy="66" r="23" fill="#6257e6"/>
  <g transform="translate(120,66)">
    <rect x="-4.5" y="-9" width="9" height="14" rx="4.5" fill="#fff"/>
    <path d="M-7,-1 a7,7 0 0 0 14,0" fill="none" stroke="#fff" stroke-width="2"/>
    <line x1="0" y1="6" x2="0" y2="9" stroke="#fff" stroke-width="2"/>
  </g>
  <text x="120" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Idle</text>
  <text x="120" y="146" text-anchor="middle" font-size="12" fill="#8b8f98">small orb</text>

  <!-- Hover: controls slide out -->
  <rect x="262" y="44" width="182" height="44" rx="22" fill="#191920" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="289" cy="66" r="18" fill="#6257e6"/>
  <g transform="translate(289,66)">
    <rect x="-4" y="-8" width="8" height="12" rx="4" fill="#fff"/>
    <path d="M-6,-1 a6,6 0 0 0 12,0" fill="none" stroke="#fff" stroke-width="1.8"/>
    <line x1="0" y1="5" x2="0" y2="8" stroke="#fff" stroke-width="1.8"/>
  </g>
  <circle cx="340" cy="66" r="15" fill="#ffffff" fill-opacity="0.10"/>
  <g transform="translate(340,66)" stroke="#fff" stroke-width="1.4" fill="none">
    <circle r="6"/><line x1="0" y1="0" x2="0" y2="-3.5"/><line x1="0" y1="0" x2="3" y2="0"/>
  </g>
  <circle cx="378" cy="66" r="15" fill="#ffffff" fill-opacity="0.10"/>
  <g transform="translate(378,66)" fill="#fff">
    <rect x="-5" y="-3" width="2.2" height="6" rx="1.1"/>
    <rect x="-1.1" y="-6" width="2.2" height="12" rx="1.1"/>
    <rect x="2.8" y="-4" width="2.2" height="8" rx="1.1"/>
  </g>
  <circle cx="416" cy="66" r="15" fill="#ffffff" fill-opacity="0.10"/>
  <g transform="translate(416,66)">
    <circle r="5" fill="none" stroke="#fff" stroke-width="1.4"/>
    <circle r="1.7" fill="#fff"/>
  </g>
  <text x="353" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Hover</text>
  <text x="353" y="146" text-anchor="middle" font-size="12" fill="#8b8f98">controls slide out</text>

  <!-- Recording: red orb + waveform -->
  <rect x="512" y="44" width="150" height="44" rx="22" fill="#191920" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="539" cy="66" r="18" fill="#e2483d"/>
  <rect x="533" y="60" width="12" height="12" rx="3" fill="#fff"/>
  <g fill="#ffffff">
    <rect x="566" y="62" width="2.6" height="8" rx="1.3" opacity="0.5"/>
    <rect x="572" y="58" width="2.6" height="16" rx="1.3" opacity="0.6"/>
    <rect x="578" y="63" width="2.6" height="6" rx="1.3" opacity="0.55"/>
    <rect x="584" y="56" width="2.6" height="20" rx="1.3" opacity="0.7"/>
    <rect x="590" y="61" width="2.6" height="10" rx="1.3" opacity="0.65"/>
    <rect x="596" y="57" width="2.6" height="18" rx="1.3" opacity="0.75"/>
    <rect x="602" y="63" width="2.6" height="6" rx="1.3" opacity="0.7"/>
    <rect x="608" y="59" width="2.6" height="14" rx="1.3" opacity="0.8"/>
    <rect x="614" y="62" width="2.6" height="9" rx="1.3" opacity="0.75"/>
    <rect x="620" y="57" width="2.6" height="18" rx="1.3" opacity="0.85"/>
  </g>
  <text x="587" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Recording</text>
  <text x="587" y="146" text-anchor="middle" font-size="12" fill="#8b8f98">live waveform</text>

  <!-- Transcribing -->
  <rect x="700" y="44" width="190" height="44" rx="22" fill="#191920" stroke="#ffffff" stroke-opacity="0.10"/>
  <circle cx="727" cy="66" r="18" fill="#6257e6"/>
  <g transform="translate(727,66)" fill="#fff">
    <rect x="-6" y="-4" width="2.5" height="8" rx="1.25"/>
    <rect x="-1.25" y="-7" width="2.5" height="14" rx="1.25"/>
    <rect x="3.5" y="-5" width="2.5" height="10" rx="1.25"/>
  </g>
  <text x="754" y="71" font-size="13" font-weight="500" fill="#fff">Transcribing&#8230;</text>
  <text x="795" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#fff">Transcribing</text>
  <text x="795" y="146" text-anchor="middle" font-size="12" fill="#8b8f98">then inserts</text>
</svg>
